name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: [server, runtime, cli, e2e]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: botinc_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: botinc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U botinc_test -d botinc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://botinc_test:ci-only-password@localhost:5432/botinc_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: '**/go.sum'
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: Test with race detection and verify execution
        run: bash scripts/ci/go-test.sh '${{ matrix.module }}'
      - name: Build every package
        working-directory: ${{ matrix.module }}
        run: go build ./...
      - name: Upload complete test and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-${{ matrix.module }}
          path: .ci-results/${{ matrix.module }}/
          if-no-files-found: error

  images:
    name: Image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            context: server
            file: server/Dockerfile
          - image: web
            context: .
            file: apps/web/Dockerfile
          - image: runtime
            context: runtime
            file: runtime/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  required:
    name: Required checks
    if: always()
    needs: [web, go, images]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      WEB_RESULT: ${{ needs.web.result }}
      GO_RESULT: ${{ needs.go.result }}
      IMAGE_RESULT: ${{ needs.images.result }}
    steps:
      - run: |
          test "$WEB_RESULT" = success
          test "$GO_RESULT" = success
          test "$IMAGE_RESULT" = success
